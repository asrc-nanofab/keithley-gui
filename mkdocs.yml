site_name: Keithley IV Measurement
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - User Guide:
    # - Installation: installation.md
    - Windows Setup: windows-setup.md
    - Usage: usage.md
  # - Reference:
  #   - Settings: settings.md
  #   - Troubleshooting: troubleshooting.md
